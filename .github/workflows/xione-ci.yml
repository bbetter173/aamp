name: XiOne cross-build

# Builds AAMP for the Sky XiOne and asserts the artifacts are actually loadable
# on the device. See XIONE-BUILD.md.
#
# Scoped by paths: this is a cross-compile of the whole player and takes minutes,
# so it runs when the sources or the build definition change, not on docs-only
# PRs. The CMake build is untouched by any of this — //:aamp is
# target_compatible_with the XiOne board constraint and is skipped in wildcards.

on:
  pull_request:
    paths:
      - "**.c"
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - "**/CMakeLists.txt"
      - "cmake/**"
      - "middleware/**"
      - "support/**"
      - "tsb/**"
      - "jsbindings/**"
      - "subtec/**"
      - "downloader/**"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - "bazel/**"
      - "third_party/**"
      - "scripts/libdash-patches/**"
      - "tools/release/**"
      - ".github/workflows/xione-ci.yml"
  push:
    branches: [feat/xione-bazel-build]
  workflow_dispatch:

concurrency:
  group: xione-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify (armv7 XiOne)
    # Linux x86_64 only: the Bootlin cross-compiler ships x86_64 host binaries,
    # so exec_compatible_with pins linux+x86_64 and an arm runner cannot build.
    runs-on: gke-arc-aamp

    steps:
      - uses: actions/checkout@v4

      - name: Install host build requirements
        # binutils: `ar`, to unwrap the .deb payloads in deb_sysroot.
        # pkg-config: preferred over rules_foreign_cc's from-source bootstrap,
        #   which compiles a vendored glib that is invalid under a C23 default.
        # patchelf: RPATH rewrite in the staging step.
        run: |
          # The ARC runner image runs as root without sudo; GitHub-hosted needs
          # sudo. Pick whichever exists so the workflow runs on either.
          SUDO=""
          command -v sudo >/dev/null 2>&1 && SUDO=sudo
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends binutils pkg-config patchelf

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          # The expensive, rarely-changing inputs are the Bootlin toolchain and
          # the 36 pinned .debs, so key on what pins them.
          key: bazel-xione-${{ hashFiles('MODULE.bazel.lock', 'third_party/xione_sysroot/xione-debs.json') }}
          restore-keys: |
            bazel-xione-

      - name: Build
        run: bazelisk build //:aamp --platforms=//bazel/platforms:xione

      - name: Verify artifacts
        # These are the real regression tests. The failure mode that matters here
        # is not "does it compile" but "did it silently build for the wrong
        # architecture, or lose a library the device needs".
        run: |
          set -euo pipefail
          LIBDIR="$(bazelisk info bazel-bin)/aamp/lib"
          EXPECTED=9
          count=0

          for so in "$LIBDIR"/*.so; do
            name="$(basename "$so")"
            hdr="$(readelf -h "$so")"
            grep -q 'Class: *ELF32' <<<"$hdr" || { echo "::error::$name is not ELF32"; exit 1; }
            grep -q 'Machine: *ARM' <<<"$hdr" || { echo "::error::$name is not EM_ARM"; exit 1; }
            grep -q 'hard-float' <<<"$hdr"    || { echo "::error::$name is not hard-float ABI"; exit 1; }
            count=$((count + 1))
            echo "ok: $name"
          done

          # A dropped middleware library still links but cannot load on device,
          # so assert the count rather than trusting the build to notice.
          [ "$count" -eq "$EXPECTED" ] || {
            echo "::error::expected $EXPECTED shared libraries, found $count"
            exit 1
          }

          # Every AAMP-internal DT_NEEDED must be satisfied by a sibling.
          for so in "$LIBDIR"/*.so; do
            readelf -d "$so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | while read -r need; do
              case "$need" in
                libaamp*.so|libplayer*.so|libmetrics.so|libbaseconversion.so|libsubtec.so)
                  [ -f "$LIBDIR/$need" ] || {
                    echo "::error::$(basename "$so") needs $need, which was not built"
                    exit 1
                  } ;;
              esac
            done
          done
          echo "internal DT_NEEDED closure is self-contained"

      - name: Verify release staging
        # Exercise the staging path on every run, so an RPATH or packaging
        # regression surfaces here and not at release time.
        run: bash tools/release/stage_artifacts.sh --version ci-${{ github.sha }}
